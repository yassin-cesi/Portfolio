<!doctype html>
<html lang="fr">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Mon Portfolio</title>
    <link rel="stylesheet" href="./css/style.css" />
  </head>
  <body>
    <header>
      <h1>Mon Portfolio Professionnel</h1>
      <nav>
        <label class="switch" aria-label="Basculer thème clair/sombre">
          <input type="checkbox" id="theme-toggle" />
          <div class="slider">
            <div class="slider-thumb">
              <!-- Lune (dark mode) -->
              <svg
                class="icon-moon"
                viewBox="0 0 24 24"
                fill="none"
                stroke="#334155"
                stroke-width="2.2"
                stroke-linecap="round"
                stroke-linejoin="round"
              >
                <path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z" />
              </svg>
              <!-- Soleil (light mode) -->
              <svg
                class="icon-sun"
                viewBox="0 0 24 24"
                fill="none"
                stroke="#0284c7"
                stroke-width="2.2"
                stroke-linecap="round"
                stroke-linejoin="round"
              >
                <circle cx="12" cy="12" r="5" />
                <line x1="12" y1="1" x2="12" y2="3" />
                <line x1="12" y1="21" x2="12" y2="23" />
                <line x1="4.22" y1="4.22" x2="5.64" y2="5.64" />
                <line x1="18.36" y1="18.36" x2="19.78" y2="19.78" />
                <line x1="1" y1="12" x2="3" y2="12" />
                <line x1="21" y1="12" x2="23" y2="12" />
                <line x1="4.22" y1="19.78" x2="5.64" y2="18.36" />
                <line x1="18.36" y1="5.64" x2="19.78" y2="4.22" />
              </svg>
            </div>
          </div>
        </label>
        <a href="#projects">Projets</a>
        <a href="#contact">Contact</a>
      </nav>
    </header>

    <main>
      <section id="projects">
        <h2>Mes Réalisations</h2>
        <div id="projects-container" class="projects-grid"></div>
        <div id="project-modal" class="modal">
          <div class="modal-content">
            <span class="close-modal">&times;</span>

            <h2 id="modal-title">Titre du Projet</h2>
            <p id="modal-desc">Description détaillée...</p>

            <h3>Galerie d'images</h3>
            <div id="modal-gallery" class="modal-gallery"></div>
          </div>
        </div>
        <div id="lightbox" class="lightbox">
          <span class="close-lightbox">&times;</span>
          <img id="lightbox-img" src="" alt="Image en grand" />
        </div>
      </section>
    </main>

    <section id="contact">
      <h2>Me contacter</h2>
      <p class="contact-subtitle">
        Un projet, une opportunité ou une simple question ? Écrivez-moi !
      </p>

      <div class="contact-container">
        <form id="contact-form">
          <div class="form-group">
            <label for="name">Nom / Entreprise</label>
            <input
              type="text"
              id="name"
              required
              placeholder="Ex: Développeurs & Co"
            />
          </div>

          <div class="form-group">
            <label for="email">Adresse Email</label>
            <input
              type="email"
              id="email"
              required
              placeholder="Ex: contact@entreprise.fr"
            />
          </div>

          <div class="form-group">
            <label for="subject">Objet</label>
            <input
              type="text"
              id="subject"
              required
              placeholder="Ex: Proposition d'alternance / Stage"
            />
          </div>

          <div class="form-group">
            <label for="content">Message</label>
            <textarea
              id="content"
              required
              rows="6"
              placeholder="Votre message ici..."
            ></textarea>
          </div>

          <button type="submit" id="btn-submit">Envoyer le message</button>
          <p id="form-response" class="form-response"></p>
        </form>
      </div>
    </section>

    <script src="./js/main.js"></script>
  </body>
</html>
