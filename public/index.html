<!doctype html>
<html lang="fr">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Mon Portfolio</title>
    <link rel="stylesheet" href="./css/style.css" />
  </head>
  <body>
    <header>
      <h1>Mon Portfolio Professionnel</h1>
      <nav>
        <a href="#projects">Projets</a>
        <a href="#contact">Contact</a>
      </nav>
    </header>

    <main>
      <section id="projects">
        <h2>Mes Réalisations</h2>
        <div id="projects-container" class="projects-grid"></div>
      </section>
    </main>

    <div id="project-modal" class="modal">
      <div class="modal-content">
        <span class="close-modal">&times;</span>

        <h2 id="modal-title">Titre du Projet</h2>
        <p id="modal-desc">Description détaillée...</p>

        <h3>Galerie d'images</h3>
        <div id="modal-gallery" class="modal-gallery"></div>
      </div>
    </div>
    <div id="lightbox" class="lightbox">
      <span class="close-lightbox">&times;</span>
      <img id="lightbox-img" src="" alt="Image en grand" />
    </div>

    <script src="./js/main.js"></script>
  </body>
</html>
