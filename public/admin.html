<!doctype html>
<html lang="fr">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Console d'Administration</title>
    <link rel="stylesheet" href="./css/style.css" />
    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css"
    />
  </head>
  <body class="admin-body">
    <div class="admin-sidebar">
      <h2>Dashboard</h2>
      <nav class="admin-nav">
        <a href="#messages" class="active" onclick="switchTab('messages')"
          ><i class="fas fa-envelope"></i> Messages</a
        >
        <a href="#add-project" onclick="switchTab('add-project')"
          ><i class="fas fa-plus-circle"></i> Ajouter un projet</a
        >
        <a href="#calendar" onclick="switchTab('calendar')"
          ><i class="fas fa-calendar-alt"></i> Calendrier</a
        >
        <a href="index.html" class="back-site"
          ><i class="fas fa-arrow-left"></i> Voir le site</a
        >
      </nav>
    </div>

    <main class="admin-content">
      <section id="tab-messages" class="admin-section active">
        <h2>Messages Reçus</h2>
        <div id="messages-list" class="messages-list">
          <p>Chargement des messages...</p>
        </div>
      </section>

      <section id="tab-add-project" class="admin-section">
        <h2>Ajouter un Nouveau Projet</h2>
        <form id="add-project-form" class="admin-form">
          <div class="form-group">
            <label for="proj-title">Titre du projet</label>
            <input
              type="text"
              id="proj-title"
              required
              placeholder="Ex: WineShop APP"
            />
          </div>
          <div class="form-group">
            <label for="proj-desc">Description</label>
            <textarea
              id="proj-desc"
              required
              rows="5"
              placeholder="Détails du projet..."
            ></textarea>
          </div>
          <div class="form-row">
            <div class="form-group">
              <label for="proj-link1">Lien GitHub (Principal / API)</label>
              <input
                type="url"
                id="proj-link1"
                placeholder="https://github.com/..."
              />
            </div>
            <div class="form-group">
              <label for="proj-link2">Lien GitHub 2 (Optionnel / Front)</label>
              <input
                type="url"
                id="proj-link2"
                placeholder="https://github.com/..."
              />
            </div>
          </div>
          <div class="form-group">
            <label for="proj-languages"
              >Technologies / Langages (Séparés par des virgules)</label
            >
            <input
              type="text"
              id="proj-languages"
              placeholder="Ex: C#, SQL, React Native"
            />
          </div>
          <div class="form-group">
            <label for="proj-image">URL de l'image principale</label>
            <input
              type="text"
              id="proj-image"
              required
              placeholder="Ex: images/img_bdd_wineshop/wineshop_accueil.png"
            />
          </div>
          <button type="submit" class="btn-admin-submit">
            Publier le projet
          </button>
          <p id="project-response"></p>
        </form>
      </section>

      <section id="tab-calendar" class="admin-section">
        <h2>Mon Calendrier Professionnel</h2>
        <div class="calendar-container">
          <div class="calendar-placeholder">
            <i
              class="fas fa-calendar-days"
              style="
                font-size: 3rem;
                color: var(--text-muted);
                margin-bottom: 15px;
              "
            ></i>
            <p>Module Calendrier en cours de synchronisation...</p>
          </div>
        </div>
      </section>
    </main>

    <script src="./js/admin.js"></script>
  </body>
</html>
